name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history. Starlight's `lastUpdated` and the sitemap's <lastmod>
          # both read each file's last commit date, and the default shallow
          # clone gives every page the same one — before this, all 64 pages
          # claimed they were updated at the instant of the last deploy.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peakhour-help --branch=main

      # Tell Bing and the other IndexNow engines which pages changed. A failure
      # here does not fail the deploy, because the pages are already live.
      - name: Submit changed pages to IndexNow
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/submit-indexnow.mjs "$BEFORE" "$AFTER"
          else
            node scripts/submit-indexnow.mjs --all
          fi
